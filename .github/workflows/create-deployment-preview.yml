name: Astronomer CI - Create Preview Deployment

on:
  push:
    branches:
      - main-testing
  pull_request:
    branches:
      - main-testing

env:
  ## Set your Workspace API key token as a GitHub secret
  ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Airflow branch
        uses: actions/checkout@v3
        with:
          ref: main-testing

      - name: Pull Latest DBT Code
        run: |
          git fetch origin main-dbt
          git checkout main-dbt
          rsync -av --progress . ../dbt_temp --exclude .git
          git checkout main-testing
          rsync -av --progress ../dbt_temp/ ./dags/
          rm -rf ../dbt_temp

      - name: Commit & Push Changes to Airflow
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add dags/
          git commit -m "Updated DAGs with latest DBT code"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/changze2/ADO_P01_Team4_Assignment2.git main-testing

      - name: Create Preview Deployment
        uses: astronomer/deploy-action@v0.3
        with:
          action: create-deployment-preview
          deployment-id: cm6xr6ctf0lvv01jpebn5z9fj  #--

