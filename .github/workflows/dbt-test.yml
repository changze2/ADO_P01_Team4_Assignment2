name: dbt Testing and Deployment

on:
  push:
    branches:
      - main-dbt-testing  # Trigger the workflow on push to the main branch
  pull_request:
    branches:
      - main-dbt-testing  # Trigger the workflow on pull requests to the main branch

jobs:

  validate-dbt:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      # Step 7: Checkout main-airflow branch
      - name: Checkout main-airflow
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/changze2/ADO_P01_Team4_Assignment2.git --branch main-testing airflow_repo

      # Step 8: Copy the `dbt_testing/` project to the Airflow DAGs folder
      - name: Copy DBT Project to Airflow DAGs
        run: |
          mkdir -p airflow_repo/dags/dbt_testing  # Ensure the target folder exists
          rsync -av --progress dbt_testing/ airflow_repo/dags/dbt_testing/  # Copy only DBT project

      # Step 9: Commit & Push Changes to main-airflow
      - name: Commit & Push Changes to main-testing
        run: |
          cd airflow_repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add dags/dbt_testing/
          git commit -m "Updated dbt_testing project from main-dbt-testing" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/changze2/ADO_P01_Team4_Assignment2.git main-testing

      # Step 10: Notify on Success
      - name: Notify on Success
        if: success()
        run: echo "✅ DBT Model Testing and Deployment executed successfully for branch ${{ github.ref_name }}"
      # Step 3: Install dbt and dependencies
      - name: Install dbt and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-snowflake
          dbt deps

      # Step 4: Create profiles.yml
      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          echo "dbt_testing:" > ~/.dbt/profiles.yml  # Use the profile name from dbt_project.yml
          echo "  target: test" >> ~/.dbt/profiles.yml
          echo "  outputs:" >> ~/.dbt/profiles.yml
          echo "    test:" >> ~/.dbt/profiles.yml
          echo "      type: snowflake" >> ~/.dbt/profiles.yml
          echo "      account: \"${{ secrets.SNOWFLAKE_ACCOUNT }}\"" >> ~/.dbt/profiles.yml
          echo "      user: \"${{ secrets.SNOWFLAKE_USERNAME }}\"" >> ~/.dbt/profiles.yml
          echo "      password: \"${{ secrets.SNOWFLAKE_PASSWORD }}\"" >> ~/.dbt/profiles.yml
          echo "      role: \"${{ secrets.SNOWFLAKE_ROLE }}\"" >> ~/.dbt/profiles.yml
          echo "      database: \"${{ secrets.SNOWFLAKE_TEST_DATABASE }}\"" >> ~/.dbt/profiles.yml
          echo "      warehouse: \"${{ secrets.SNOWFLAKE_WAREHOUSE }}\"" >> ~/.dbt/profiles.yml
          echo "      schema: \"${{ secrets.SNOWFLAKE_TEST_SCHEMA }}\"" >> ~/.dbt/profiles.yml
          echo "    prod:" >> ~/.dbt/profiles.yml
          echo "      type: snowflake" >> ~/.dbt/profiles.yml
          echo "      account: \"${{ secrets.SNOWFLAKE_ACCOUNT }}\"" >> ~/.dbt/profiles.yml
          echo "      user: \"${{ secrets.SNOWFLAKE_USERNAME }}\"" >> ~/.dbt/profiles.yml
          echo "      password: \"${{ secrets.SNOWFLAKE_PASSWORD }}\"" >> ~/.dbt/profiles.yml
          echo "      role: \"${{ secrets.SNOWFLAKE_ROLE }}\"" >> ~/.dbt/profiles.yml
          echo "      database: \"${{ secrets.SNOWFLAKE_DATABASE }}\"" >> ~/.dbt/profiles.yml
          echo "      warehouse: \"${{ secrets.SNOWFLAKE_WAREHOUSE }}\"" >> ~/.dbt/profiles.yml
          echo "      schema: \"${{ secrets.SNOWFLAKE_SCHEMA }}\"" >> ~/.dbt/profiles.yml

      # Step 5: Run dbt Commands in Testing Environment
      - name: Run dbt in Testing Environment
        run: |
          dbt debug --target test
          dbt run --target test

      # Step 6: Deploy dbt Models to Production
      - name: Deploy to Production
        if: success()
        run: |
          dbt debug --target prod
          dbt test --target prod
          dbt run --target prod

      # Step 7: Notify on Success
      - name: Notify on Success
        if: success()
        run: echo "DBT Model Testing and Deployment executed successfully for branch ${{ github.ref_name }}"
